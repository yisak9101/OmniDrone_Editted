name: TransportHover

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_
  # - /base/randomization_base@_here_

env:
  num_envs: 1
  env_spacing: 10
  max_episode_length: 2000

drone_model: Crazyflie
num_drones: 1
force_sensor: false
time_encoding: false

payload_mass_scale: [0.15, 0.25]

bar_mass_scale: [0.0005, 0.0015]

reward_effort_weight: 0.5
reward_spin_weight: 1.0
reward_swing_weight: 0.8
reward_action_smoothness_weight: 0.5
reward_distance_scale: 1.2
safe_distance: 0.4

ravel_obs: true
flatten_state: true

action_transform: rate
